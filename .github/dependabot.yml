# Dependabot : mises à jour automatiques des dépendances (15/10/2026).
#
# Paquet de type « library » (composer.lock non commité : voir .gitignore) ;
# Dependabot ne surveille que les contraintes de composer.json. Aucun workflow
# GitHub Actions dans ce dépôt, donc pas d'écosystème github-actions.
#
# - Mises à jour de VERSION : une fois par semaine, regroupées (mineures +
#   correctifs dans une seule PR ; chaque version majeure reste une PR
#   séparée, à relire). Elles ciblent `develop`.
# - Mises à jour de SÉCURITÉ : à activer dans les réglages GitHub (Code
#   security). D'après la doc GitHub, elles ciblent toujours la branche par
#   défaut (`main`) et, dès que `target-branch` est défini, les réglages
#   ci-dessous (branche, regroupement) ne s'appliquent pas à elles.
# - GitHub ne lit ce fichier que sur la branche par défaut (`main`).
version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
